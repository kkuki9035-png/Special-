<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Happy Birthday Riyuu ♡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: #3D0D15;
            background-image: radial-gradient(circle at 50% 20%, #7A2234 0%, #3D0D15 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px;
            padding-top: 50px;
            padding-bottom: 90px; /* Space for the floating CD player at the bottom */
        }

        /* Top Fixed Rotation Hint Badge */
        .rotate-hint {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(61, 13, 21, 0.85);
            color: #FFD2D7;
            border: 1px solid rgba(232, 155, 167, 0.3);
            backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        /* Floating Spinning CD Music Player */
        .cd-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #23060C;
            border: 2px solid #E89BA7;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            cursor: pointer;
            outline: none;
            padding: 0;
        }

        /* CD Inner Grooves Look */
        .cd-groove {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px dashed rgba(232, 155, 167, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Center Hole of CD */
        .cd-center {
            width: 16px;
            height: 16px;
            background: #FFF8F5;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
        }

        /* Spinning Animation class */
        @keyframes spin {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        .cd-player.playing {
            animation: spin 3s linear infinite;
        }

        /* Container keeping pages stacked closely with maximum readability */
        .scroll-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .page-card {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .page-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>

    <!-- Subtle Top Rotation Hint -->
    <div class="rotate-hint">
        <span>📱 Rotate your mobile for best view</span>
    </div>

    <!-- Background Audio Element -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Floating Spinning CD Button (Bottom Center) -->
    <button class="cd-player" id="musicToggle" onclick="toggleMusic()" title="Play/Pause Music">
        <div class="cd-groove">
            <div class="cd-center">💿</div>
        </div>
    </button>

    <div class="scroll-container">
        <!-- Page 1 -->
        <div class="page-card">
            <img src="page1.png" onerror="this.onerror=null;this.src='page1.jpg';" alt="Happy Birthday RIYUU">
        </div>

        <!-- Page 2 -->
        <div class="page-card">
            <img src="page2.png" onerror="this.onerror=null;this.src='page2.jpg';" alt="A Note From My Heart">
        </div>

        /* Page 3 */
        <div class="page-card">
            <img src="page3.png" onerror="this.onerror=null;this.src='page3.jpg';" alt="Little Things">
        </div>

        <!-- Page 4 -->
        <div class="page-card">
            <img src="page4.png" onerror="this.onerror=null;this.src='page4.jpg';" alt="Our Little World">
        </div>

        <!-- Page 5 -->
        <div class="page-card">
            <img src="page5.png" onerror="this.onerror=null;this.src='page5.jpg';" alt="My Wish For You">
        </div>

        <!-- Page 6 -->
        <div class="page-card">
            <img src="page6.png" onerror="this.onerror=null;this.src='page6.jpg';" alt="One Last Thing">
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('musicToggle');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                btn.classList.remove('playing');
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    btn.classList.add('playing');
                }).catch(e => {
                    alert("Please upload 'song.mp3' in your repository first!");
                });
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
