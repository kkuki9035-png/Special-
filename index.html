<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Happy Birthday Riyuu ♡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: #3D0D15;
            background-image: radial-gradient(circle at 50% 20%, #7A2234 0%, #3D0D15 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px;
            padding-top: 50px; /* Space for fixed rotation hint */
        }

        /* Top Fixed Rotation Hint Badge */
        .rotate-hint {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(61, 13, 21, 0.85);
            color: #FFD2D7;
            border: 1px solid rgba(232, 155, 167, 0.3);
            backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        /* Container keeping pages stacked closely with maximum readability */
        .scroll-container {
            width: 100%;
            max-width: 520px; /* Wider container so landscape images look large and clear */
            display: flex;
            flex-direction: column;
            gap: 12px; /* Minimal gap so pages remain connected */
        }

        .page-card {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .page-card img {
            width: 100%;
            height: auto; /* Preserves full original aspect ratio so nothing gets cropped */
            display: block;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>

    <!-- Subtle Top Rotation Hint -->
    <div class="rotate-hint">
        <span>📱 Rotate your mobile for best view</span>
    </div>

    <div class="scroll-container">
        <!-- Page 1 -->
        <div class="page-card">
            <img src="page1.png" onerror="this.onerror=null;this.src='page1.jpg';" alt="Happy Birthday RIYUU">
        </div>

        <!-- Page 2 -->
        <div class="page-card">
            <img src="page2.png" onerror="this.onerror=null;this.src='page2.jpg';" alt="A Note From My Heart">
        </div>

        <!-- Page 3 -->
        <div class="page-card">
            <img src="page3.png" onerror="this.onerror=null;this.src='page3.jpg';" alt="Little Things">
        </div>

        <!-- Page 4 -->
        <div class="page-card">
            <img src="page4.png" onerror="this.onerror=null;this.src='page4.jpg';" alt="Our Little World">
        </div>

        <!-- Page 5 -->
        <div class="page-card">
            <img src="page5.png" onerror="this.onerror=null;this.src='page5.jpg';" alt="My Wish For You">
        </div>

        <!-- Page 6 -->
        <div class="page-card">
            <img src="page6.png" onerror="this.onerror=null;this.src='page6.jpg';" alt="One Last Thing">
        </div>
    </div>

</body>
</html>
